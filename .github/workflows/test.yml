name: test

on:
  push:
  pull_request:

jobs:
  optimize:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node optimize.mjs test/tmp/sample.glb out/sample.glb --triangles 3000 --texture 256
      - run: node preview.mjs out --out preview
